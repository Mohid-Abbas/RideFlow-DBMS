<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Rides - RideFlow Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
        }
        
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            padding: 30px 20px;
            color: white;
        }
        
        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 40px;
            text-align: center;
        }
        
        .nav-menu {
            list-style: none;
        }
        
        .nav-item {
            margin: 10px 0;
        }
        
        .nav-link {
            display: block;
            padding: 12px 20px;
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s;
        }
        
        .nav-link:hover, .nav-link.active {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        
        .logout-btn {
            position: absolute;
            bottom: 30px;
            left: 20px;
            right: 20px;
            padding: 12px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .main-content {
            margin-left: 260px;
            padding: 30px;
        }
        
        .header {
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #333;
            font-size: 1.8rem;
        }
        
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .stats-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        
        .stats-card h4 {
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }
        
        .stats-card .value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #667eea;
        }
        
        .section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        
        .section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }
        
        .rides-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .rides-table th,
        .rides-table td {
            padding: 15px 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .rides-table th {
            color: #666;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            background: #f8f9fa;
        }
        
        .rides-table tr:hover {
            background: #f8f9fa;
        }
        
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .status-requested { background: #fff3cd; color: #856404; }
        .status-accepted { background: #e2e3f3; color: #383d7a; }
        .status-driver-en-route { background: #d1ecf1; color: #0c5460; }
        .status-in-progress { background: #cce5ff; color: #004085; }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .no-data {
            text-align: center;
            padding: 60px;
            color: #666;
        }
        
        .refresh-btn {
            float: right;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .refresh-btn:hover {
            background: #5a6fd6;
        }
        
        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #48bb78;
            font-size: 0.9rem;
        }
        
        .live-indicator::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #48bb78;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">🚗 RideFlow</div>
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="/admin/dashboard" class="nav-link">📊 Dashboard</a>
            </li>
            <li class="nav-item">
                <a href="/admin/users" class="nav-link">👥 Users</a>
            </li>
            <li class="nav-item">
                <a href="/admin/vehicles" class="nav-link">🚗 Vehicles</a>
            </li>
            <li class="nav-item">
                <a href="/admin/fare-rules" class="nav-link">💰 Fare Rules</a>
            </li>
            <li class="nav-item">
                <a href="/admin/active-rides" class="nav-link active">🚨 Active Rides</a>
            </li>
            <li class="nav-item">
                <a href="/admin/reports" class="nav-link">📈 Reports</a>
            </li>
        </ul>
        <button class="logout-btn" onclick="logout()">🚪 Logout</button>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>🚨 Active Rides Monitor</h1>
        </div>

        <div class="stats-cards">
            <div class="stats-card">
                <h4>Requested</h4>
                <div class="value" id="requestedCount">-</div>
            </div>
            <div class="stats-card">
                <h4>Accepted</h4>
                <div class="value" id="acceptedCount">-</div>
            </div>
            <div class="stats-card">
                <h4>En Route</h4>
                <div class="value" id="enRouteCount">-</div>
            </div>
            <div class="stats-card">
                <h4>In Progress</h4>
                <div class="value" id="inProgressCount">-</div>
            </div>
        </div>

        <div class="section">
            <h2>
                <span class="live-indicator">Live Rides</span>
                <button class="refresh-btn" onclick="loadActiveRides()">Refresh</button>
            </h2>
            <div id="ridesContainer" class="loading">Loading active rides...</div>
        </div>
    </div>

    <script>
        async function loadActiveRides() {
            try {
                const res = await fetch('/api/admin/active-rides');
                const rides = await res.json();
                
                // Update counts
                document.getElementById('requestedCount').textContent = 
                    rides.filter(r => r.ride_status === 'REQUESTED').length;
                document.getElementById('acceptedCount').textContent = 
                    rides.filter(r => r.ride_status === 'ACCEPTED').length;
                document.getElementById('enRouteCount').textContent = 
                    rides.filter(r => r.ride_status === 'DRIVER_EN_ROUTE').length;
                document.getElementById('inProgressCount').textContent = 
                    rides.filter(r => r.ride_status === 'IN_PROGRESS').length;
                
                // Display rides
                const container = document.getElementById('ridesContainer');
                
                if (rides.length === 0) {
                    container.innerHTML = `
                        <div class="no-data">
                            <h3>No active rides</h3>
                            <p>All rides are currently completed or cancelled</p>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = `
                    <table class="rides-table">
                        <thead>
                            <tr>
                                <th>Ride ID</th>
                                <th>Status</th>
                                <th>Rider</th>
                                <th>Driver</th>
                                <th>Vehicle</th>
                                <th>Pickup</th>
                                <th>Dropoff</th>
                                <th>Fare</th>
                                <th>Requested</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rides.map(ride => `
                                <tr>
                                    <td>#${ride.ride_id}</td>
                                    <td>
                                        <span class="status-badge status-${ride.ride_status.toLowerCase().replace(/_/g, '-')}">
                                            ${ride.ride_status.replace(/_/g, ' ')}
                                        </span>
                                    </td>
                                    <td>${ride.rider_name}<br><small>${ride.rider_phone}</small></td>
                                    <td>${ride.driver_name || 'Not assigned'}</td>
                                    <td>${ride.vehicle_make || ''} ${ride.vehicle_model || ''}</td>
                                    <td>${ride.pickup_address || ride.pickup_city}</td>
                                    <td>${ride.dropoff_address || ride.dropoff_city}</td>
                                    <td>PKR ${parseFloat(ride.fare).toFixed(0)}</td>
                                    <td>${new Date(ride.requested_at).toLocaleTimeString()}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (error) {
                console.error('Error loading active rides:', error);
            }
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login';
        }

        loadActiveRides();
        // Auto-refresh every 30 seconds
        setInterval(loadActiveRides, 30000);
    </script>
</body>
</html>
