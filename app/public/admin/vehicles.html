<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Vehicles - RideFlow Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
        }
        
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            padding: 30px 20px;
            color: white;
        }
        
        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 40px;
            text-align: center;
        }
        
        .nav-menu {
            list-style: none;
        }
        
        .nav-item {
            margin: 10px 0;
        }
        
        .nav-link {
            display: block;
            padding: 12px 20px;
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s;
        }
        
        .nav-link:hover, .nav-link.active {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        
        .logout-btn {
            position: absolute;
            bottom: 30px;
            left: 20px;
            right: 20px;
            padding: 12px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .main-content {
            margin-left: 260px;
            padding: 30px;
        }
        
        .header {
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #333;
            font-size: 1.8rem;
        }
        
        .filter-bar {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .filter-bar select {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .stats-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        
        .stats-card h4 {
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }
        
        .stats-card .value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #667eea;
        }
        
        .section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        
        .section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .data-table th,
        .data-table td {
            padding: 15px 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .data-table th {
            color: #666;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            background: #f8f9fa;
        }
        
        .data-table tr:hover {
            background: #f8f9fa;
        }
        
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .status-verified { background: #d4edda; color: #155724; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-rejected { background: #f8d7da; color: #721c24; }
        
        .vehicle-type {
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .type-economy { background: #d1fae5; color: #065f46; }
        .type-premium { background: #e0e7ff; color: #4338ca; }
        .type-bike { background: #fef3c7; color: #92400e; }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .btn-verify {
            background: #48bb78;
            color: white;
        }
        
        .btn-reject {
            background: #e53e3e;
            color: white;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">🚗 RideFlow</div>
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="/admin/dashboard" class="nav-link">📊 Dashboard</a>
            </li>
            <li class="nav-item">
                <a href="/admin/users" class="nav-link">👥 Users</a>
            </li>
            <li class="nav-item">
                <a href="/admin/vehicles" class="nav-link active">🚗 Vehicles</a>
            </li>
            <li class="nav-item">
                <a href="/admin/fare-rules" class="nav-link">💰 Fare Rules</a>
            </li>
            <li class="nav-item">
                <a href="/admin/active-rides" class="nav-link">🚨 Active Rides</a>
            </li>
            <li class="nav-item">
                <a href="/admin/reports" class="nav-link">📈 Reports</a>
            </li>
        </ul>
        <button class="logout-btn" onclick="logout()">🚪 Logout</button>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>🚗 Manage Vehicles</h1>
        </div>

        <div class="stats-cards">
            <div class="stats-card">
                <h4>Total Vehicles</h4>
                <div class="value" id="totalVehicles">-</div>
            </div>
            <div class="stats-card">
                <h4>Verified</h4>
                <div class="value" id="verifiedVehicles">-</div>
            </div>
            <div class="stats-card">
                <h4>Pending</h4>
                <div class="value" id="pendingVehicles">-</div>
            </div>
            <div class="stats-card">
                <h4>Rejected</h4>
                <div class="value" id="rejectedVehicles">-</div>
            </div>
        </div>

        <div class="filter-bar">
            <select id="statusFilter">
                <option value="">All Status</option>
                <option value="VERIFIED">Verified</option>
                <option value="PENDING">Pending</option>
                <option value="REJECTED">Rejected</option>
            </select>
            <select id="typeFilter">
                <option value="">All Types</option>
                <option value="ECONOMY">Economy</option>
                <option value="PREMIUM">Premium</option>
                <option value="BIKE">Bike</option>
            </select>
        </div>

        <div class="section">
            <h2>Vehicle List</h2>
            <div id="vehiclesContainer" class="loading">Loading vehicles...</div>
        </div>
    </div>

    <script>
        let allVehicles = [];

        async function loadVehicles() {
            try {
                const res = await fetch('/api/admin/vehicles');
                allVehicles = await res.json();
                
                // Update stats
                document.getElementById('totalVehicles').textContent = allVehicles.length;
                document.getElementById('verifiedVehicles').textContent = 
                    allVehicles.filter(v => v.verif_status === 'VERIFIED').length;
                document.getElementById('pendingVehicles').textContent = 
                    allVehicles.filter(v => v.verif_status === 'PENDING').length;
                document.getElementById('rejectedVehicles').textContent = 
                    allVehicles.filter(v => v.verif_status === 'REJECTED').length;
                
                renderVehicles();
            } catch (error) {
                console.error('Error loading vehicles:', error);
            }
        }

        function renderVehicles() {
            const container = document.getElementById('vehiclesContainer');
            
            let filtered = allVehicles;
            
            const statusFilter = document.getElementById('statusFilter').value;
            if (statusFilter) {
                filtered = filtered.filter(v => v.verif_status === statusFilter);
            }
            
            const typeFilter = document.getElementById('typeFilter').value;
            if (typeFilter) {
                filtered = filtered.filter(v => v.vehicle_type === typeFilter);
            }
            
            if (filtered.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:#666;">No vehicles found</p>';
                return;
            }
            
            container.innerHTML = `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Vehicle ID</th>
                            <th>Driver</th>
                            <th>Make/Model</th>
                            <th>Year</th>
                            <th>License Plate</th>
                            <th>Type</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${filtered.map(vehicle => `
                            <tr>
                                <td>#${vehicle.vehicle_id}</td>
                                <td>${vehicle.driver_name}</td>
                                <td>${vehicle.make} ${vehicle.model}</td>
                                <td>${vehicle.vehicle_year}</td>
                                <td>${vehicle.license_plate}</td>
                                <td>
                                    <span class="vehicle-type type-${vehicle.vehicle_type.toLowerCase()}">
                                        ${vehicle.vehicle_type}
                                    </span>
                                </td>
                                <td>
                                    <span class="status-badge status-${vehicle.verif_status.toLowerCase()}">
                                        ${vehicle.verif_status}
                                    </span>
                                </td>
                                <td>
                                    ${vehicle.verif_status !== 'VERIFIED' ? 
                                        `<button class="btn btn-verify" onclick="verifyVehicle(${vehicle.vehicle_id})">Verify</button>` : ''}
                                    ${vehicle.verif_status !== 'REJECTED' ? 
                                        `<button class="btn btn-reject" onclick="rejectVehicle(${vehicle.vehicle_id})">Reject</button>` : ''}
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        async function verifyVehicle(vehicleId) {
            try {
                const res = await fetch('/api/admin/verify-vehicle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vehicle_id: vehicleId, status: 'VERIFIED' })
                });
                
                if (res.ok) {
                    alert('Vehicle verified successfully!');
                    loadVehicles();
                }
            } catch (error) {
                console.error('Error verifying vehicle:', error);
            }
        }

        async function rejectVehicle(vehicleId) {
            try {
                const res = await fetch('/api/admin/verify-vehicle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vehicle_id: vehicleId, status: 'REJECTED' })
                });
                
                if (res.ok) {
                    alert('Vehicle rejected');
                    loadVehicles();
                }
            } catch (error) {
                console.error('Error rejecting vehicle:', error);
            }
        }

        document.getElementById('statusFilter').addEventListener('change', renderVehicles);
        document.getElementById('typeFilter').addEventListener('change', renderVehicles);

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login';
        }

        loadVehicles();
    </script>
</body>
</html>
