<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - RideFlow Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
        }
        
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            padding: 30px 20px;
            color: white;
        }
        
        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 40px;
            text-align: center;
        }
        
        .nav-menu {
            list-style: none;
        }
        
        .nav-item {
            margin: 10px 0;
        }
        
        .nav-link {
            display: block;
            padding: 12px 20px;
            color: rgba(255,255,255,0.9);
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s;
        }
        
        .nav-link:hover, .nav-link.active {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        
        .logout-btn {
            position: absolute;
            bottom: 30px;
            left: 20px;
            right: 20px;
            padding: 12px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .main-content {
            margin-left: 260px;
            padding: 30px;
        }
        
        .header {
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #333;
            font-size: 1.8rem;
        }
        
        .filter-bar {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-bar label {
            font-weight: 500;
            color: #666;
        }
        
        .filter-bar input {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .btn-generate {
            padding: 10px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        
        .btn-generate:hover {
            opacity: 0.9;
        }
        
        .reports-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }
        
        @media (max-width: 900px) {
            .reports-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .report-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        
        .report-card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-item h4 {
            color: #666;
            font-size: 0.8rem;
            margin-bottom: 8px;
        }
        
        .stat-item .value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #667eea;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        
        .data-table th,
        .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .data-table th {
            color: #666;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            background: #f8f9fa;
        }
        
        .data-table tr:hover {
            background: #f8f9fa;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .chart-placeholder {
            background: #f0f0f0;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            color: #666;
        }
        
        .revenue-total {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-top: 20px;
        }
        
        .revenue-total h4 {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 10px;
        }
        
        .revenue-total .amount {
            font-size: 2rem;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">🚗 RideFlow</div>
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="/admin/dashboard" class="nav-link">📊 Dashboard</a>
            </li>
            <li class="nav-item">
                <a href="/admin/users" class="nav-link">👥 Users</a>
            </li>
            <li class="nav-item">
                <a href="/admin/vehicles" class="nav-link">🚗 Vehicles</a>
            </li>
            <li class="nav-item">
                <a href="/admin/fare-rules" class="nav-link">💰 Fare Rules</a>
            </li>
            <li class="nav-item">
                <a href="/admin/active-rides" class="nav-link">🚨 Active Rides</a>
            </li>
            <li class="nav-item">
                <a href="/admin/reports" class="nav-link active">📈 Reports</a>
            </li>
        </ul>
        <button class="logout-btn" onclick="logout()">🚪 Logout</button>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>📈 Reports & Analytics</h1>
        </div>

        <div class="filter-bar">
            <label>Date Range:</label>
            <input type="date" id="startDate">
            <span>to</span>
            <input type="date" id="endDate">
            <button class="btn-generate" onclick="generateReports()">Generate Report</button>
        </div>

        <div class="reports-grid">
            <div class="report-card">
                <h2>📊 Revenue by City</h2>
                <div id="cityRevenueContainer" class="loading">Loading...</div>
            </div>

            <div class="report-card">
                <h2>💰 Payment Methods Breakdown</h2>
                <div id="paymentMethodContainer" class="loading">Loading...</div>
            </div>

            <div class="report-card">
                <h2>📅 Daily Revenue Report</h2>
                <div id="dailyRevenueContainer" class="loading">Loading...</div>
            </div>

            <div class="report-card">
                <h2>🚗 Driver Performance Summary</h2>
                <div id="driverSummaryContainer" class="loading">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        // Set default date range (last 30 days)
        const endDate = new Date();
        const startDate = new Date();
        startDate.setDate(startDate.getDate() - 30);
        
        document.getElementById('startDate').value = startDate.toISOString().split('T')[0];
        document.getElementById('endDate').value = endDate.toISOString().split('T')[0];

        async function generateReports() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            
            loadCityRevenue(start, end);
            loadDailyRevenue(start, end);
            loadDriverSummary();
        }

        async function loadCityRevenue(start, end) {
            try {
                const res = await fetch('/api/admin/city-revenue');
                const data = await res.json();
                
                const container = document.getElementById('cityRevenueContainer');
                
                if (data.length === 0) {
                    container.innerHTML = '<p style="text-align:center;color:#666;">No data available</p>';
                    return;
                }
                
                const totalRevenue = data.reduce((sum, item) => sum + parseFloat(item.total_revenue || 0), 0);
                
                container.innerHTML = `
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>City</th>
                                <th>Total Rides</th>
                                <th>Revenue</th>
                                <th>Avg Fare</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.map(item => `
                                <tr>
                                    <td>${item.city}</td>
                                    <td>${item.total_rides}</td>
                                    <td>PKR ${parseFloat(item.total_revenue).toFixed(0)}</td>
                                    <td>PKR ${parseFloat(item.avg_fare).toFixed(0)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    <div class="revenue-total">
                        <h4>Total Revenue</h4>
                        <div class="amount">PKR ${totalRevenue.toFixed(0)}</div>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading city revenue:', error);
            }
        }

        async function loadDailyRevenue(start, end) {
            try {
                const res = await fetch(`/api/admin/revenue-report?start_date=${start}&end_date=${end}`);
                const data = await res.json();
                
                const container = document.getElementById('dailyRevenueContainer');
                
                if (data.length === 0) {
                    container.innerHTML = '<p style="text-align:center;color:#666;">No data available for selected date range</p>';
                    return;
                }
                
                container.innerHTML = `
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>City</th>
                                <th>Rides</th>
                                <th>Collected</th>
                                <th>Method</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.slice(0, 10).map(item => `
                                <tr>
                                    <td>${new Date(item.ride_date).toLocaleDateString()}</td>
                                    <td>${item.city}</td>
                                    <td>${item.total_rides}</td>
                                    <td>PKR ${parseFloat(item.total_collected || 0).toFixed(0)}</td>
                                    <td>${item.payment_method}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
                
                // Also update payment methods
                updatePaymentMethods(data);
            } catch (error) {
                console.error('Error loading daily revenue:', error);
            }
        }

        function updatePaymentMethods(data) {
            const methods = {};
            data.forEach(item => {
                const method = item.payment_method || 'CASH';
                if (!methods[method]) {
                    methods[method] = { count: 0, amount: 0 };
                }
                methods[method].count += item.total_rides;
                methods[method].amount += parseFloat(item.total_collected || 0);
            });
            
            const container = document.getElementById('paymentMethodContainer');
            
            const methodData = Object.entries(methods).map(([name, stats]) => ({
                name,
                ...stats
            }));
            
            container.innerHTML = `
                <div class="stats-grid">
                    ${methodData.map(m => `
                        <div class="stat-item">
                            <h4>${m.name}</h4>
                            <div class="value">${m.count}</div>
                            <small>PKR ${m.amount.toFixed(0)}</small>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        async function loadDriverSummary() {
            try {
                const res = await fetch('/api/admin/drivers');
                const drivers = await res.json();
                
                const container = document.getElementById('driverSummaryContainer');
                
                // Sort by rating
                const topDrivers = [...drivers]
                    .sort((a, b) => (b.avg_rating || 0) - (a.avg_rating || 0))
                    .slice(0, 5);
                
                container.innerHTML = `
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Driver</th>
                                <th>Rating</th>
                                <th>Trips</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${topDrivers.map(driver => `
                                <tr>
                                    <td>${driver.full_name}</td>
                                    <td>⭐ ${driver.avg_rating || '0.0'}</td>
                                    <td>${driver.total_trips || 0}</td>
                                    <td>${driver.avail_status || 'OFFLINE'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    <div class="stats-grid" style="margin-top: 20px;">
                        <div class="stat-item">
                            <h4>Total Drivers</h4>
                            <div class="value">${drivers.length}</div>
                        </div>
                        <div class="stat-item">
                            <h4>Online</h4>
                            <div class="value">${drivers.filter(d => d.avail_status === 'ONLINE').length}</div>
                        </div>
                        <div class="stat-item">
                            <h4>On Trip</h4>
                            <div class="value">${drivers.filter(d => d.avail_status === 'ON_TRIP').length}</div>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading driver summary:', error);
            }
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login';
        }

        // Load initial reports
        generateReports();
    </script>
</body>
</html>
